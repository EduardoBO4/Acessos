<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>HUB-SE | Início</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="index.css">
  <link rel="stylesheet" href="../components/layout.css">
</head>
<body>

  <!-- Navbar Global Unificada -->
  <div id="site-navbar" data-pagina="inicio"></div>

  <main>
    <!-- Seção Hero: com trava inline de tamanho -->
    <section class="hero">
      <img 
        src="../assets/logos/logodeitada.png" 
        alt="HUB-SE" 
        class="hero-logo" 
        style="max-width: 800px; width: 90%; height: auto; display: block;"
      >
    </section>

    <!-- Critério 2: Imagem Humberto (Fallback caso o carrossel suma / 0 notícias) -->
    <div id="fallback-humberto" class="fallback-humberto" hidden aria-hidden="true">
      <img 
        src="../assets/logos/logodeitada.png" 
        alt="Destaque HUB-SE" 
        style="max-width: 500px; width: 90%; height: auto; border-radius: 16px; opacity: 0.85;"
      >
    </div>

    <!-- Critério 1: Carrossel de Notícias -->
    <section id="noticias-section" class="noticias-section" hidden>
      <div id="noticias-container" class="noticias-container"></div>
    </section>
  </main>

  <!-- Footer Global Unificado -->
  <div id="site-footer"></div>

  <script src="../components/layout.js"></script>
  <script>
    const LARGURA_CARD = 260;
    const ESPACO = 25;
    const CHAVE_CACHE = 'hubse_noticias_cache';

    const secaoNoticias = document.getElementById('noticias-section');
    const container = document.getElementById('noticias-container');
    const fallbackHumberto = document.getElementById('fallback-humberto');

    let noticiasValidas = [];
    let modoAtual = null; // 'estatico' | 'carrossel'

    /* 3. Lifecycle e Cache */
    async function obterNoticias() {
      const salvo = sessionStorage.getItem(CHAVE_CACHE);
      if (salvo) {
        try { return JSON.parse(salvo); } catch (_) { sessionStorage.removeItem(CHAVE_CACHE); }
      }
      const resp = await fetch('noticias.json', { cache: 'no-cache' });
      if (!resp.ok) throw new Error(`Status ${resp.status}`);
      const dados = await resp.json();
      sessionStorage.setItem(CHAVE_CACHE, JSON.stringify(dados));
      return dados;
    }

    /* 1. Filtro de Validade */
    function filtrarValidas(lista) {
      const agora = new Date();
      return (lista || [])
        .filter(n => !n.data_vencimento || new Date(n.data_vencimento) >= agora)
        .sort((a, b) => new Date(b.data_lancamento || 0) - new Date(a.data_lancamento || 0));
    }

    /* 1. Cálculo Dinâmico de Capacidade Visível */
    function calcularCapacidadeVisivel() {
      const largura = secaoNoticias.clientWidth || window.innerWidth;
      // (+ ESPACO) pois o último card não tem margem à direita
      return Math.max(1, Math.floor((largura + ESPACO) / (LARGURA_CARD + ESPACO)));
    }

    function criarCard(item) {
      const a = document.createElement('a');
      a.href = item.link || '#';
      a.className = 'noticia-card';

      const img = document.createElement('img');
      img.src = item.imagem || '../assets/logos/logoempe.png';
      img.alt = item.titulo || 'Notícia';
      img.className = 'noticia-img';
      img.loading = 'lazy';

      const corpo = document.createElement('div');
      corpo.className = 'noticia-conteudo';

      const h3 = document.createElement('h3');
      h3.className = 'noticia-titulo';
      h3.textContent = item.titulo;

      const p = document.createElement('p');
      p.className = 'noticia-descricao';
      p.textContent = item.descricao;

      corpo.append(h3, p);
      a.append(img, corpo);
      return a;
    }

    /* 1 & 2. Renderização */
    function renderizar() {
      // 0 notícias válidas: esconde o carrossel e mostra a imagem fallback
      if (noticiasValidas.length === 0) {
        secaoNoticias.hidden = true;
        fallbackHumberto.hidden = false;
        fallbackHumberto.removeAttribute('aria-hidden');
        modoAtual = null;
        return;
      }

      // Notícias válidas existem: esconde fallback e exibe seção
      fallbackHumberto.hidden = true;
      fallbackHumberto.setAttribute('aria-hidden', 'true');
      secaoNoticias.hidden = false;

      const capacidade = calcularCapacidadeVisivel();
      const novoModo = noticiasValidas.length > capacidade ? 'carrossel' : 'estatico';

      if (novoModo === modoAtual && container.children.length > 0) return;
      modoAtual = novoModo;

      // Limpa cards antigos para evitar duplicidade ao redimensionar ou voltar de página
      container.replaceChildren();

      if (novoModo === 'carrossel') {
        container.className = 'noticias-container noticias-carrossel';
        // Duplica para rotação contínua 360° sem salto
        [...noticiasValidas, ...noticiasValidas].forEach(n => container.appendChild(criarCard(n)));
      } else {
        container.className = 'noticias-container noticias-estaticas';
        noticiasValidas.forEach(n => container.appendChild(criarCard(n)));
      }
    }

    async function iniciar() {
      try {
        const dados = await obterNoticias();
        noticiasValidas = filtrarValidas(dados);
      } catch (err) {
        console.error('Erro ao buscar notícias:', err);
        noticiasValidas = [];
      }
      renderizar();
    }

    // Monitora redimensionamento de janela sem travar em breakpoints fixos
    new ResizeObserver(() => renderizar()).observe(document.body);

    // Garante restauração limpa ao voltar de página (bfcache)
    window.addEventListener('pageshow', (ev) => {
      if (ev.persisted) {
        modoAtual = null;
        renderizar();
      }
    });

    iniciar();
  </script>
</body>
</html>
